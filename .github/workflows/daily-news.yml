
name: Daily IT News Intelligence

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate news and send test email
        env:
          NEWS_EMAIL_USER: ${{ secrets.NEWS_EMAIL_USER }}
          NEWS_EMAIL_PASSWORD: ${{ secrets.NEWS_EMAIL_PASSWORD }}
          NEWS_EMAIL_TO: ${{ secrets.NEWS_EMAIL_TO }}
        run: python it_news_platform.py --no-video

      - name: Publish latest news to dashboard
        run: |
          cp "$(ls -t news_output/*.json | head -n 1)" website/latest-news.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/latest-news.json
          if ! git diff --cached --quiet; then
            git commit -m "Update daily IT news"
            git push
          fi
